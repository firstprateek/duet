[project]
name = "duet-sorter"
version = "0.1.0"
description = "Duet's sorting service on the Mac mini: embeddings and a small LLM through Ollama, and Laya once it's trained on our history."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.scripts]
duet-sorter = "duet_sorter.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["duet_sorter"]
